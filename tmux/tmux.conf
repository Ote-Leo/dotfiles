##### Prefix ###############################################################

# Omarchy-style prefix, with the traditional tmux prefix as a fallback.
set -g prefix C-Space
set -g prefix2 C-b

unbind C-b
bind C-Space send-prefix

# Reload configuration: Prefix + q
bind -N "Reload tmux configuration" q \
	source-file ~/.config/tmux/tmux.conf \
	\; display-message "tmux configuration reloaded"


##### Terminal capabilities ################################################

# Advertise modern colour support inside tmux.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Let applications receive focus changes.
set -g focus-events on

# Permit supported terminal escape sequences through tmux.
set -g allow-passthrough on

# Support cursor-shape changes used by Readline, Neovim, etc.
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Reduce delay when leaving Vi insert mode.
set -sg escape-time 10


##### General behaviour ####################################################

set -g mouse on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g history-limit 100000

# Keep tmux alive when its last session is destroyed.
set -g exit-empty off

# Stay connected when the current session is destroyed.
set -g detach-on-destroy off

# Resize windows according to the smallest attached client.
setw -g aggressive-resize on

# Rename windows after their current directory.
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'

set -g set-titles on
set -g set-titles-string '#S:#I:#W'


##### New windows and panes ################################################

bind -N "Create new windows start in the current pane's directory" c \
	new-window -c "#{pane_current_path}"

bind -N "Split pane below, separated by a horizontal border" h \
	split-window -v -c "#{pane_current_path}"

bind -N "Split pane to the right, separated by a vertical border" v \
	split-window -h -c "#{pane_current_path}"

# More memorable alternatives.
bind -N "Split pane below" - split-window -v -c "#{pane_current_path}"
bind -N "Split pane right" | split-window -h -c "#{pane_current_path}"

bind -N "Close the current pane" x kill-pane
bind -N "Toggle pane zoom" z resize-pane -Z


##### Pane navigation ######################################################

# Prefix + h/j/k/l moves between panes.
#
# h is also the vertical-split binding above. Once a pane has been split,
# use these uppercase bindings or the arrow bindings below for navigation.
bind -N "Move to pane left" H select-pane -L
bind -N "Move to pane below" J select-pane -D
bind -N "Move to pane above" K select-pane -U
bind -N "Move to pane right" L select-pane -R

bind -N "Move to pance left" Left  select-pane -L
bind -N "Move to pance below" Down  select-pane -D
bind -N "Move to pance above" Up    select-pane -U
bind -N "Move to pance right" Right select-pane -R

# Repeatable pane resizing: Prefix + Alt-h/j/k/l.
bind -r M-h resize-pane -L 3
bind -r M-j resize-pane -D 3
bind -r M-k resize-pane -U 3
bind -r M-l resize-pane -R 3

bind -N "Cycle to the next layout" Space next-layout


##### Windows #############################################################

bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Kill window" k kill-window

# Alt+1 through Alt+9 switches directly, without a prefix.
bind -n -N "Select window 1" M-1 select-window -t 1
bind -n -N "Select window 2" M-2 select-window -t 2
bind -n -N "Select window 3" M-3 select-window -t 3
bind -n -N "Select window 4" M-4 select-window -t 4
bind -n -N "Select window 5" M-5 select-window -t 5
bind -n -N "Select window 6" M-6 select-window -t 6
bind -n -N "Select window 7" M-7 select-window -t 7
bind -n -N "Select window 8" M-8 select-window -t 8
bind -n -N "Select window 9" M-9 select-window -t 9

# Alt+Left/Right changes windows.
bind -n -N "Previous window" M-Left  previous-window
bind -n -N "Next window" M-Right next-window

bind -N "Previous window" < previous-window
bind -N "Next window" > next-window
unbind p
unbind n

# Alt+Shift+Left/Right reorders windows.
bind -n -N "Swap current window with the previous" M-S-Left \
	swap-window -t -1 \; previous-window
bind -n  -N "Swap current window with the next" M-S-Right \
	swap-window -t +1 \; next-window

bind -N "Return to the last window." Tab last-window


##### Sessions ############################################################

bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create new session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K confirm-before -p "Kill session #S? (y/n)" kill-session

bind -N "Switch with the previous client" P switch-client -p
bind -N "Switch with the next client" N switch-client -n

bind -N "Open interactive session chooser" s choose-tree -Zs
bind -N "Open interactive window chooser" w choose-tree -Zw


##### Copy mode ############################################################

setw -g mode-keys vi

# Enter copy mode: Prefix + [
bind -N "Enter copy mode" [ copy-mode

# Vi-style selection.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Copy to the Windows clipboard under WSL.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip.exe"

# Mouse selections also go to the Windows clipboard.
bind -T copy-mode-vi MouseDragEnd1Pane \
	send-keys -X copy-pipe-and-cancel "clip.exe"

# Cancel copy mode.
bind -T copy-mode-vi Escape send-keys -X cancel


##### Clipboard ############################################################

set -g set-clipboard on

# Paste tmux's most recent buffer.
bind -N "Paste tmux buffer" p paste-buffer


##### Status bar ###########################################################

set -g status-position top
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80
set -g window-status-separator ""

set -g status-style "bg=default,fg=default"

# Session name.
set -g status-left \
	"#[fg=black,bg=blue,bold] #S #[bg=default] "

# Prefix/copy/zoom indicators, host and time.
set -g status-right \
	"#[fg=blue,bold]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}"\
"#[fg=brightblack]#h  "\
"#[fg=default]%H:%M "

set -g window-status-format \
	"#[fg=brightblack] #I:#W "

set -g window-status-current-format \
	"#[fg=blue,bold] #I:#W "

set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"

set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"

setw -g clock-mode-colour blue

bind -N "Search configured keybindings" ? \
	display-popup -E -w 90% -h 80% \
	"tmux list-keys -N | fzf --layout=reverse --border --prompt='Keybinding > '"

# bind -N "Search and execute keybindings" ? \
# 	display-popup \
# 		-T " tmux keybindings " \
# 		-E \
# 		-w 90% \
# 		-h 80% \
# 		"~/.config/tmux/scripts/key-picker"

bind  -N "Search every raw tmux binding" M-? \
	display-popup -E -w 90% -h 80% \
	"tmux list-keys | fzf --layout=reverse --border --prompt='All bindings > '"
